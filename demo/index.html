earance==='Light'?'#f7f5f0':'#0d1320');document.documentElement.style.setProperty('--card',s.appearance==='Light'?'#fff':'#182132');document.documentElement.style.setProperty('--fg',s.appearance==='Light'?'#202b38':'#f5f0ea');document.documentElement.style.setProperty('--muted',s.appearance==='Light'?'#606d7b':'#a6adbe')}function set(k,v){s[k]=v;render()}function navTo(v){s.tab=v;s.settings=false;s.editor=null;s.modal=null;render();$('screen').scrollTop=0}function showModal(type,data=null){s.modal={type,data};render()}function edit(type,data=null){s.editor={type,data};render()}function close(){s.modal=null;s.editor=null;render()}function svg(tab){return `<svg viewBox="0 0 24 24">${icons[tab]}</svg>`}function seg(opts,val,fn,cls=''){return `<div class="seg ${cls}">${opts.map(x=>`<button class="${x===val?'selected':''}" onclick="${fn},'${x}')">${esc(x)}</button>`).join('')}</div>`}function btn(x,onclick,cls='pill'){return `<button class="${cls}" onclick="${onclick}">${x}</button>`}function card(content,cls=''){return `<div class="card ${cls}">${content}</div>`}function render(){actTheme();$('nav').innerHTML=['Home','Calendar','Meals','Grocery','Daily list'].map(t=>`<button class="navbtn ${s.tab===t?'active':''}" onclick="navTo('${t}')"><span class="navico">${svg(t)}</span>${t}</button>`).join('');$('screen').innerHTML=s.settings?settings():({Home:home,Calendar:calendar,Meals:meals,Grocery:grocery,'Daily list':daily}[s.tab])();$('overlayhost').innerHTML=(s.editor?editor():s.modal?modal():'');}function title(x){return `<h1 class="page-title">${x}</h1>`}function subHeader(t){return `<div class="row" style="margin:0 0 28px"><button class="editor-link" style="color:var(--fg);font-size:22px" onclick="s.settings=false;render()">←</button><span style="font-size:25px">${t}</span></div>`}function home(){const wx=`<svg viewBox="0 0 48 48" class="weather-glyph" aria-hidden="true"><path d="M9 31c-3-1-4-5-2-8 2-3 5-4 8-3 2-8 15-10 19-2 8-1 12 9 5 13H9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M12 37h23M18 42h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`;const gear=`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.7 7.7 0 0 0 .05-1.88l2-1.56-2-3.46-2.37.96a7.5 7.5 0 0 0-1.63-.95L14.83 3h-4l-.36 3.05a7.5 7.5 0 0 0-1.63.95l-2.37-.96-2 3.46 2 1.56a7.7 7.7 0 0 0 0 1.88l-2 1.56 2 3.46 2.37-.96c.49.4 1.04.72 1.63.95l.36 3.05h4l.36-3.05c.59-.23 1.14-.55 1.63-.95l2.37.96 2-3.46-2-1.56ZM12.83 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-.83 0)"/></svg>`;return `<div class="homepage home-native"><div class="home-weatherhead"><div class="home-clock">11:09<span>PM</span></div><div class="home-weatherstats"><span class="home-green-dot"></span>${wx}<span class="home-temp">46°</span><button class="home-gear" aria-label="Open settings" onclick="s.settings=true;render()">${gear}</button></div></div><div class="home-date">Tuesday, October 20</div><div class="home-condition">Fog · H 68° L 38°</div><div class="home-timeline"><div class="timeline-canvas"><div class="timeline-event timeline-work">Parent A work 10–6</div><div class="timeline-event timeline-pickup"><span class="timeline-dot"></span><span>School pick...</span></div></div><div class="timeline-axis"><span>6 AM</span><span>12 PM</span><span>4</span><span>8</span></div></div><button class="home-next" onclick="navTo('Calendar')"><div class="home-eyebrow">UP NEXT</div><div class="home-empty-next">Nothing else on the calendar today</div></button><div class="home-duo"><button class="home-card home-meal" onclick="navTo('Meals')"><div class="home-eyebrow">TOMORROW<br>NIGHT</div><div class="home-food">🍝</div><div class="home-foodname">Spaghetti and meat sauce</div><span class="home-prep">Normal</span></button><button class="home-card home-countdown" onclick="showModal('countdown')"><div class="home-eyebrow">COUNTDOWN</div><div class="home-count-number">4<span>days</span></div><div class="home-count-title">Birthday party</div><div class="home-count-sub">Sat, Oct 24 · 2 more</div></button></div><div class="home-hourly"><div class="home-hourly-heading">NEXT HOURS</div><div class="home-hours">${['Now','12 AM','1 AM','2 AM','3 AM'].map((h,i)=>`<div class="home-hour"><div class="home-hour-label">${h}</div>${wx}<div class="home-degree">${[46,45,44,44,43][i]}°</div></div>`).join('')}</div></div><div class="home-lower">${card(`<div class="row between"><b>Upcoming events</b>${btn('Calendar →',"navTo('Calendar')",'textbtn')}</div><div class="muted small" style="margin-top:10px">Friday · School concert</div>`)}</div></div>`}const evs=[{day:20,time:'10:00 AM',end:'6:00 PM',title:'Parent A work 10–6',name:'Parent A',color:'#ed7da7'},{day:20,time:'4:45 PM',end:'5:45 PM',title:'School pickup',name:'Parent B',color:'#cba780'},{day:23,time:'ALL DAY',end:'',title:'Bring instrument to school',name:'Mia',color:'#52cadc'},{day:23,time:'5:30 PM',end:'8:30 PM',title:'Family dinner',name:'Family',color:'#b695f5'},{day:24,time:'11:00 AM',end:'',title:'Haircuts for kids',name:'Family',color:'#b695f5'},{day:24,time:'2:00 PM',end:'',title:'Birthday party',name:'Family',color:'#b695f5'}];function eventcard(e){let initials=e.name==='Family'?'F':e.name==='Parent A'?'A':e.name==='Parent B'?'B':e.name[0];return `<button class="card eventcard event-row" style="--eventcolor:${e.color};margin:7px 0" onclick="showModal('event',${evs.indexOf(e)})"><div class="event-time"><strong>${e.time}</strong>${e.end?`<span class="muted">to ${e.end}</span>`:''}</div><div class="event-details"><div class="eventtitle">${esc(e.title)}</div><div class="event-person" style="color:${e.color}"><span class="event-avatar" style="border-color:${e.color}">${e.name==='Mia'||e.name==='Leo'?avatar(e.name):initials}</span>${esc(e.name)}</div></div></button>`}function calendar(){let selector=`<div class="row" style="margin-bottom:10px">${['Agenda','Week','Month'].map(v=>btn(v,`set('calendar','${v}')`,'pill '+(s.calendar===v?'on':''))).join('')}</div>`;return title('Calendar')+selector+`<div class="chips cal-actions">${btn('+ Add event',"showModal('eventAdd')",'cta')}${btn('<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.1 12a7.2 7.2 0 1 1-1.8-4.8L20 12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',"showModal('synced')",'pill refresh-btn')}${btn('Manage',"edit('calendarManage')")}${btn('Countdowns',"showModal('countdown')")}</div><div class="muted small" style="margin-bottom:18px">Updated recently. Tap an event for details. Hold to count down.</div>`+(s.calendar==='Agenda'?calendarAgenda():s.calendar==='Month'?calendarMonth():calendarWeek())}function calendarAgenda(){return ['TODAY','FRI','SAT'].map((x,i)=>`<div class="agendaheader"><b class="${i===0?'green':'muted'}">${x}</b> <span class="muted">${['Tuesday, Oct 20','Oct 23','Oct 24'][i]}</span></div>${evs.filter(e=>e.day===[20,23,24][i]).map(eventcard).join('')}`).join('')}function calendarMonth(){let m=10+s.monthOffset;let dt=new Date(2026,m-1,1),label=dt.toLocaleString('en-US',{month:'long',year:'numeric'}),start=(dt.getDay()+6)%7;let cells=[...Array.from({length:start},(_,i)=>new Date(dt.getFullYear(),dt.getMonth(),i-start+1)),...Array.from({length:42-start},(_,i)=>new Date(dt.getFullYear(),dt.getMonth(),i+1))];return `<div class="row between" style="margin:8px 0 16px">${btn('‹',"s.monthOffset--;render()",'textbtn')}<strong>${label}</strong>${btn('›',"s.monthOffset++;render()",'textbtn')}${btn('Today',"s.monthOffset=0;render()")}</div><div class="monthgrid">${['M','T','W','T','F','S','S'].map(x=>`<div class="muted small" style="text-align:center">${x}</div>`).join('')}${cells.map(dt=>{let n=dt.getDate(),match=dt.getMonth()===9&&s.monthOffset===0?evs.filter(e=>e.day===n):[];return `<div class="monthcell ${n===20&&s.monthOffset===0?'current':''}" onclick="showModal('date',${n})">${n}${match.slice(0,2).map(e=>`<i>${esc(e.title)}</i>`).join('')}</div>`}).join('')}</div><div class="agendaheader green">TODAY</div>${evs.slice(0,2).map(eventcard).join('')}`}function calendarWeek(){return `<div class="row between" style="margin:8px 0 20px">${btn('‹',"s.weekOffset--;render()",'textbtn')}<strong>Oct ${19+s.weekOffset*7} to ${25+s.weekOffset*7}</strong>${btn('›',"s.weekOffset++;render()",'textbtn')}${btn('Today',"s.weekOffset=0;render()")}</div><div class="weekgrid">${['',...days].map(x=>`<div class="muted">${x}</div>`).join('')}${['all','1p','2p','3p','4p','5p','6p','7p','8p'].map((t,i)=>`<div class="muted" style="height:48px">${t}</div>${days.map((d,j)=>`<div style="height:48px;background:${j===1?'#222d42':'#182132'};border-radius:4px">${(i===0&&j===4)?'<div class="weekevent" style="background:#30576d">School…</div>':(i===3&&j===1)?'<div class="weekevent">Work</div>':(i===5&&j===4)?'<div class="weekevent">Dinner</div>':''}</div>`).join('')}`).join('')}</div>`}function meals(){return title('Meals')+seg(['This week','Dishes','Saved meals'],s.mealTab,"set('mealTab'")+(s.mealTab==='This week'?mealWeek():s.mealTab==='Dishes'?dishList():savedList())}function mealWeek(){return `<h2 style="font-size:19px;margin:8px 0 2px">This week</h2><div class="muted small" style="margin-bottom:9px">Oct 19 to 25</div><div class="row" style="margin-bottom:9px">${['Breakfast','Lunch','Dinner'].map(t=>`<button class="pill ${s.mealTypes.includes(t)?'on':''}" style="flex:1;padding:11px 2px;font-size:13px" onclick="toggleMealType('${t}')">${s.mealTypes.includes(t)?'✓ ':''}${t}</button>`).join('')}</div>${btn('Plan my week',"edit('plan')",'cta wide')}<div style="height:10px"></div>${days.map((d,i)=>card(`<div class="meal-line"><div class="${i===1?'today':'muted'}"><b>${d.toUpperCase()}</b><div class="daynum">${19+i}</div></div><div><button style="text-align:left;background:none;border:0;font-size:18px;font-weight:650" onclick="showModal('mealPick',${i})">${esc(s.planned[i]||'Pick dinner')}</button>${s.mealTypes.filter(t=>t!=='Dinner').map(t=>`<div class="small muted" style="margin-top:6px" onclick="showModal('mealPick',${i})">${t}: Pick ${t.toLowerCase()}</div>`).join('')}</div><button class="textbtn" onclick="showModal('mealPick',${i})">${i===1?'⌕':'›'}</button></div>`,'compact '+(i===1?'callout':'')).replace(/><div class="meal-line"/,' style="margin-bottom:8px"><div class="meal-line"')).join('')}`}function toggleMealType(t){s.mealTypes=s.mealTypes.includes(t)?s.mealTypes.filter(x=>x!==t):[...s.mealTypes,t];render()}function searchbar(placeholder){return `<input class="input search" placeholder="⌕   ${placeholder}" oninput="s.query=this.value;filterVisible()" value="${esc(s.query)}">`}function filters(){return `<div class="chips">${['All','Quick','Normal','Slow'].map(x=>btn(x,`set('filter','${x}')`,'pill '+(s.filter===x?'on':''))).join('')}</div>`}function filtered(a){return a.filter(x=>(s.filter==='All'||x.prep===s.filter)&&x.name.toLowerCase().includes(s.query.toLowerCase()))}function filterVisible(){document.querySelectorAll('[data-filter]').forEach(el=>el.hidden=!el.dataset.filter.toLowerCase().includes(s.query.toLowerCase()))}function dishList(){return `<p class="muted small" style="line-height:1.5">Single items with their own ingredients. Planning one puts them on the grocery list.</p>${searchbar('Search dishes')}${filters()}${['Breakfast','Main','Side'].map(k=>{let entries=filtered(s.dishes).filter(x=>x.kind===k);return `<div class="row between"><div class="sectionname">${k==='Main'?'MAIN DISHES':k.toUpperCase()} &nbsp; ${entries.length}</div>${btn('+ Add',`edit('dish',{kind:'${k}'})`)}</div><div class="stack">${entries.map(d=>card(`<div class="row between"><b>${esc(d.name)}</b><button class="textbtn" onclick="edit('dish',{name:${JSON.stringify(d.name)},kind:'${k}'})">${d.ingredients.length?'Edit ingredients':'Add ingredients'}</button></div>`,'compact')).join('')}</div>`}).join('')}`}function savedList(){return `${btn('+ Build a meal',"edit('saved')",'cta wide')}<div style="height:9px"></div>${searchbar('Search saved meals')}${filters()}<div class="sectionname">LUNCH AND DINNER MEALS &nbsp; ${filtered(s.saved).length}</div><div class="stack">${filtered(s.saved).map(m=>card(`<div class="row between" onclick="edit('saved',{name:${JSON.stringify(m.name)}})"><div><b>${esc(m.name)}</b><div class="green small">${m.dishes.length?m.dishes.map(esc).join(', '):'Add dishes'}</div></div><span class="muted">›</span></div>`,'compact')).join('')}</div>`}function groceryKey(){return s.groceryTab==='Weekly'?'grocery':s.groceryTab==='One time'?'oneTime':'always'}function grocery(){let key=groceryKey(),items=s[key],left=items.filter(x=>!x.done).length;return title('Grocery')+seg(['Weekly','One time','Always buy'],s.groceryTab,"set('groceryTab'")+`<div class="row between" style="margin:12px 0"><div class="muted small"><b style="color:var(--fg)">${s.groceryTab==='Always buy'?items.length+' item':left+' left'}</b> ${s.groceryTab==='Weekly'?'of '+items.length+' this week':s.groceryTab==='One time'?'of '+items.length+' for this trip':'joins the weekly list every week'}</div>${s.groceryTab==='Always buy'?'':btn('♧',"showModal('share')")}</div>${s.groceryTab==='Always buy'?'':`<div class="progress" style="margin-bottom:12px"><i style="width:${items.length?(items.length-left)/items.length*100:0}%"></i></div>`}<div class="row" style="margin-bottom:12px"><input class="input" id="addGrocery" placeholder="Add an item" onkeydown="if(event.key==='Enter')addGrocery()">${btn('+ Add',"addGrocery()",'cta')}</div>${s.groceryTab==='One time'?btn('⊕ Import cart screenshots',"showModal('import')",'pill wide'):''}${[...new Set(items.map(x=>x.cat))].map(category=>`<div class="row between"><div class="sectionname">${category}</div><div class="muted small">${items.filter(x=>x.cat===category&&!x.done).length} left</div></div><div class="stack">${items.filter(x=>x.cat===category).map(it=>card(`<div class="item">${s.groceryTab==='Always buy'?btn('⟳',`showModal('item',${it.id})`,'textbtn'):`<button class="circle ${it.done?'done':''}" onclick="toggleG(${it.id})">${it.done?'✓':''}</button>`}<div style="flex:1;min-width:0" onclick="showModal('item',${it.id})"><div class="${it.done?'strike':''}">${esc(it.name)}</div><div class="muted small">${esc(it.source)}</div></div></div>`,'compact')).join('')}</div>`).join('')}`}function addGrocery(){let e=$('addGrocery');if(!e||!e.value.trim())return;s[groceryKey()].unshift({id:uid++,name:e.value.trim(),cat:'Other',source:'',done:false});render()}function toggleG(id){let item=s[groceryKey()].find(x=>x.id===id);if(item)item.done=!item.done;render()}let tasks=[['Morning','Make bed',2],['Morning','Get dressed',2],['Morning','Brush teeth',2],['Morning','Eat breakfast',2],['Morning','Pack backpack',2],['Morning','Put laundry away',2],['Morning','Feed the pet',2],['After school','Put away backpack',1],['Evening','Behave during dinner prep',3],['Evening','Help set the table',2],['Evening','Eat dinner',2],['Evening','Clear my plate',2],['Evening','Put toys away',2],['Evening','Take a bath',2],['Evening','Put pajamas on',2],['Evening','Brush teeth',2],['Evening','Read for 15 minutes',2],['Evening','Pack for tomorrow',2]];for(const t of tasks){if(t[0]==='Morning'||t[0]==='After school'||(t[0]==='Evening'&&['Behave during dinner prep','Eat dinner','Clear my plate','Put toys away','Take a bath','Put pajamas on','Brush teeth'].includes(t[1])))s.tasks['Mia'+t[1]]=true;}const rewards=[['Pick the music at dinner or in the car',15],['15 extra minutes of screen time',25],['Dessert or small treat',30],['Pick the movie for family movie night',100],['Ice cream outing',150],['Pick the weekend breakfast or dinner',200],['Small toy or book',400]];function avatar(n){return n==='Mia'?'<img class="child-photo" src="mia.webp" alt="Fictional portrait of Mia">':n==='Leo'?'<img class="child-photo" src="leo.webp" alt="Fictional portrait of Leo">':esc(n[0]||'?')}function daily(){return `<div class="person-tabs">${names.slice(0,2).map((n,i)=>`<button class="person-tab ${s.person===n?'selected':''}" onclick="set('person','${n}')"><span class="mini-avatar" style="border-color:${i?'#83cc90':'#58cde0'}">${avatar(n)}</span><span class="person-label">${esc(n)}</span><span>${s.points[n]}</span></button>`).join('')}</div>${seg(['Tasks','Rewards'],s.dailyTab,"set('dailyTab'")}${s.dailyTab==='Tasks'?dailyTasks():dailyRewards()}`}
function dailyTasks(){let name=s.person,completed=tasks.filter(t=>s.tasks[name+t[1]]),donePoints=completed.reduce((a,t)=>a+t[2],0),totalPoints=tasks.reduce((a,t)=>a+t[2],0);return `${card(`<div class="daily-stats"><div class="av" style="border-color:#57cae0">${avatar(name)}</div><div class="stat-numbers"><div><span class="stat-points">${s.points[name]}</span><span class="muted"> pts</span></div><div class="muted">${donePoints} of ${totalPoints} today</div></div>${btn('● My color',"showModal('myColor')",'pill color-button')}</div><div class="task-progress daily-progress"><div class="progress"><i style="width:${donePoints/Math.max(totalPoints,1)*100}%;background:#57cae0"></i></div></div><div class="muted" style="margin-top:14px">${completed.some(x=>x[0]==='After school')?'After school done · ':''}Evening is up now</div><div class="daily-streak"><span>▪ ▪ ▪ ▪ ▪</span><span>New streak today</span></div><div class="row" style="justify-content:end;margin-top:18px">${btn('⭐ Give bonus',"showModal('bonus')")}</div>`,'daily-summary')}${['Morning','After school','Evening'].map(group=>{let rows=tasks.filter(x=>x[0]===group),completed=rows.filter(x=>s.tasks[name+x[1]]).length,allDone=rows.length>0&&completed===rows.length,expanded=s.expandedRoutines?.[group];if(allDone&&!expanded){return `<button class="completed-routine" onclick="s.expandedRoutines={...(s.expandedRoutines||{}),['${group}']:true};render()"><span>✓ &nbsp; ${group} · all ${rows.length} done</span><span>Show</span></button>`;}return `<div class="sectionname routine-heading">${group} ${group==='Evening'?'<span class="up-now">UP NOW</span>':''}<span class="routine-count">${completed} of ${rows.length}</span><button class="routine-hide" onclick="s.expandedRoutines={...(s.expandedRoutines||{}),['${group}']:false};render()">${allDone?'Hide':''}</button></div><div class="stack">${rows.map(([g,t,p])=>{let checked=!!s.tasks[name+t];return card(`<div class="item"><button aria-label="${checked?'Undo':'Complete'} ${esc(t)}" class="circle ${checked?'done':''}" onclick="toggleTask('${t}',${p})">${checked?'✓':''}</button><div class="task-label ${checked?'strike':''}" style="flex:1">${esc(t)}</div><b style="color:var(--gold)">${checked?'✓':'+'+p}</b></div>`,'compact task-card '+(checked?'task-completed':''))}).join('')}</div>`}).join('')}`}function toggleTask(t,p){let key=s.person+t;let old=!!s.tasks[key];s.tasks[key]=!old;s.points[s.person]+=old?-p:p;render()}function dailyRewards(){return `<div class="sectionname">REWARDS &nbsp; <span style="letter-spacing:0;text-transform:none">${s.points[s.person]} pts to spend</span></div><div class="stack">${rewards.map(([t,p])=>card(`<div class="reward"><span style="flex:1;font-size:14px">${t}</span><b>${p}</b>${s.points[s.person]>=p?btn('Redeem',`redeem(${p})`,'cta'): `<span class="muted small">${p-s.points[s.person]} to go</span>`}<span class="muted">★</span></div>`,'compact')).join('')}</div>`}function redeem(n){s.points[s.person]-=n;showModal('redeemed',n)}
const groups=[['Help and troubleshooting',[['Help and FAQ','Routines, answers, and the tour','●'],['Firestore reads','Demo data only','ⓘ']]],['Household, shared by every device',[['Sync across devices','Demo — disconnected','⟳'],['People and photos','Mia, Leo, Parent A, Parent B','◉'],['Daily list and rewards','Mia, Leo','✓'],['Photo screensaver','Off','★'],['Manage devices','Needs the household PIN','⚙']]],['This device only',[['Appearance and colors',`${s.appearance} · ${s.theme}`,'⚙'],['Profile and tabs','Family, all tabs shown','●'],['Display and schedule','Night dimming is off','▣'],['Daily list layout','Automatic','☰'],['Keep buttons low','Automatic, off here','◉'],['Home layout','Phone','☰'],['Home agenda','1 week','▣'],['Calendar agenda','30 days','▣'],['Open morning screen','Does not show by itself','▶'],['Calendar editing','In Family Hub','▣'],['Weather location','Demo weather','⌖'],['Weather app','Sample weather','⌖'],['Settings PIN','Off','▣']]],['Software',[['Software updates','Demo build · no update connection','⟳']]]];function settings(){return subHeader('Settings')+groups.map(([heading,items])=>`<div class="green small" style="margin:24px 8px 12px">${heading}</div><div class="settinggroup">${items.map(([label,sub,ic])=>`<button class="settingrow" onclick="settingsAction('${label}')"><span class="settingicon">${ic}</span><span style="flex:1"><span>${label}</span><small>${label==='Appearance and colors'?s.appearance+' · '+s.theme:sub}</small></span><span class="settingarrow">›</span></button>`).join('')}</div>`).join('')+`<div class="barbottom">Demo edition</div>`}function settingsAction(label){if(label==='Appearance and colors')showModal('appearance');else if(label==='People and photos')showModal('people');else if(label==='Daily list and rewards')edit('dailyAdmin');else showModal('setting',label)}function modal(){let m=s.modal,inner='',footer=btn('Close','close()','textbtn');if(m.type==='appearance'){inner=`<h2>Appearance and colors</h2><p>Saved on this device only. Family and calendar colors stay independent.</p><div style="margin:14px 0">Appearance</div>${seg(['Dark','Light'],s.appearance,"set('appearance'")}<div style="margin:15px 0">Accent color</div>${['Coral','Ocean','Meadow','Plum'].map(t=>`<button class="settingrow" style="background:${s.theme===t?'var(--active)':'var(--raised)'};border-radius:15px;margin-bottom:8px" onclick="set('theme','${t}')"><span style="font-size:20px;color:${{Coral:'#ff8063',Ocean:'#3185dc',Meadow:'#60d995',Plum:'#bd65d6'}[t]}">●</span><span>${t}</span><span style="margin-left:auto">${s.theme===t?'✓':''}</span></button>`).join('')}`;footer=btn('Done','close()','textbtn')}else if(m.type==='people'){inner=`<h2>People and photos</h2><p>Pick a photo for each person. These are fictional demo profiles.</p>${s.people.map(n=>`<div class="row between" style="margin:17px 0"><div class="av">${avatar(n)}</div><b style="flex:1">${esc(n)}</b><button class="textbtn" onclick="showModal('photo')">Choose photo</button></div>`).join('')}<input class="input" id="newPerson" placeholder="Add a person">${btn('Add',"addPerson()",'cta')}`;footer=btn('Done','close()','textbtn')}else if(m.type==='countdown'){inner=`<h2>Countdowns</h2>${s.countdowns.map((x,i)=>card(`<div class="row"><div class="bigcount">${x.days}</div><div style="flex:1"><b>${x.title}</b><div class="muted small">days away</div></div><button class="textbtn" onclick="s.countdowns.splice(${i},1);render()">×</button></div>`,'compact')).join('<div style="height:8px"></div>')}<div class="row" style="margin-top:12px"><input class="input" placeholder="New countdown" id="newCountdown">${btn('+ Add',"addCountdown()",'cta')}</div>`}else if(m.type==='event'){let e=evs[m.data];inner=`<h2 class="event-modal-title">${esc(e.title)}</h2><div class="event-modal-person"><span style="color:${e.color}">●</span> ${esc(e.name)}</div><div class="event-modal-date">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(2026,9,e.day).getDay()]}, Oct ${e.day}</div><div class="event-modal-date">${e.time}${e.end?' to '+e.end:''}</div><div class="event-modal-actions">${btn('Count down to this',`s.countdowns.push({title:${JSON.stringify(e.title)},days:${Math.max(e.day-20,0)}});showModal('countdown')`,'cta wide')}${btn('Edit event',`showModal('eventEdit',${m.data})`,'pill wide')}${btn('Edit in Google Calendar',"showModal('externalCalendar')",'pill wide')}</div>`;footer=btn('Close','close()','textbtn')}else if(m.type==='externalCalendar'){inner='<h2>Google Calendar</h2><p>This standalone demonstration does not connect to a Google account. No external event will be changed.</p>'}else if(m.type==='eventEdit'){let e=evs[m.data];inner=`<h2>Edit event</h2><div class="editfield"><label class="upper">Event name</label><input id="eventEditName" class="input" value="${esc(e.title)}"></div><div class="editfield"><label class="upper">Start</label><input id="eventEditTime" class="input" value="${esc(e.time)}"></div>`;footer=btn('Cancel','close()','pill')+btn('Save',`saveEditedEvent(${m.data})`,'cta')}else if(m.type==='date'){inner=`<h2>October ${m.data}</h2>${evs.filter(e=>e.day===m.data).map(eventcard).join('')||'<p>No events for this date.</p>'}`}else if(m.type==='mealPick'){inner=`<h2>Choose dinner</h2><p>${days[m.data]} — select a saved meal.</p>${s.saved.map((x,i)=>`<button class="settingrow" onclick="s.planned[${m.data}]=s.saved[${i}].name;close()">${esc(x.name)}</button>`).join('')}`}else if(m.type==='item'){let item=s[groceryKey()].find(x=>x.id===m.data);inner=`<h2>Grocery item</h2><input class="input" id="editGrocery" value="${esc(item?.name)}"><p>Category: ${esc(item?.cat)}</p>${btn('Save',`saveGrocery(${m.data})`,'cta')} ${btn('Remove',`removeGrocery(${m.data})`,'pill')}`}else if(m.type==='eventAdd'){inner=`<h2>Add event</h2><p>Events are local to this demonstration.</p><input id="eventNewName" class="input" placeholder="Event name"><input class="input" id="eventNewDate" type="date" style="margin-top:10px">`;footer=btn('Cancel','close()','pill')+btn('Save',"addEvent()",'cta')}else if(m.type==='bonus'){inner=`<h2>Give bonus points</h2><p>Reward ${s.person} for going above and beyond.</p>${[2,5,10].map(n=>btn('+'+n,`s.points[s.person]+=${n};close()`,'pill')).join(' ')}`}else if(m.type==='taskAdd'){inner=`<h2>Add ${esc(m.data)} task</h2><p>Create a task for the demo daily list.</p><input class="input" id="taskNewTitle" placeholder="Task name"><div class="row" style="margin-top:12px"><span class="muted">Points</span><select id="taskNewPoints" class="input">${[0,1,2,3,5,10].map(n=>`<option value="${n}" ${n===2?'selected':''}>${n}</option>`).join('')}</select></div>`;footer=btn('Cancel','close()','pill')+btn('Save',`saveTask('${m.data}')`,'cta')}else if(m.type==='myColor'){inner=`<h2>My color</h2><p>In the full app, each person has an independent color. The demo uses sample profiles.</p>`}else if(m.type==='redeemed'){inner=`<h2>Reward redeemed</h2><p>${m.data} points were deducted from ${s.person}'s total.</p>`}else if(m.type==='setting'){inner=`<h2>${esc(m.data)}</h2><p>This is a device or account setting. The public demo does not connect to real household accounts or change device configuration.</p>`}else if(m.type==='photo'){inner=`<h2>Profile photo</h2><p>Personal photo upload is disabled in this public-safe demo. Fictional photo portraits are used for the children.</p>`}else if(m.type==='share'){inner=`<h2>Share grocery list</h2><p>Copy the current sample grocery list.</p>${btn('Copy list',"copyGrocery()",'cta')}`}else if(m.type==='import'){inner=`<h2>Import cart screenshots</h2><p>Importing from shopping-cart screenshots requires a separate image-processing integration. No files leave this demo.</p>`}else if(m.type==='synced'){inner='<h2>Calendar refresh</h2><p>Sample calendar events are loaded locally. No personal calendar connection is used.</p>'}else{inner='<h2>Family Hub</h2>'}return `<div class="modalshade" onclick="close()"><div class="modal" onclick="event.stopPropagation()">${inner}<div class="modalfoot">${footer}</div></div></div>`}function saveTask(group){let name=$('taskNewTitle')?.value.trim();if(!name)return;tasks.push([group,name,Number($('taskNewPoints').value)]);s.modal=null;s.editor={type:'dailyEdit'};render()}function addPerson(){let v=$('newPerson').value.trim();if(!v)return;s.people.push(v);showModal('people')}function addCountdown(){let v=$('newCountdown').value.trim();if(!v)return;s.countdowns.push({title:v,days:14});showModal('countdown')}function saveEditedEvent(i){let e=evs[i];if(!e)return;e.title=$("eventEditName").value.trim()||e.title;e.time=$("eventEditTime").value.trim()||e.time;close()}function addEvent(){let v=$('eventNewName').value.trim(),d=$('eventNewDate').value;if(!v)return;let day=d?Number(d.slice(-2)):20;evs.push({day,time:'ALL DAY',end:'',title:v,name:'Family',color:'#60d995'});close()}function saveGrocery(id){let v=$('editGrocery').value.trim(),item=s[groceryKey()].find(x=>x.id===id);if(item&&v)item.name=v;close()}function removeGrocery(id){s[groceryKey()]=s[groceryKey()].filter(x=>x.id!==id);close()}function copyGrocery(){let str=s[groceryKey()].filter(x=>!x.done).map(x=>'• '+x.name).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(str).then(()=>close()).catch(()=>close());else close()}function editor(){let {type,data}=s.editor;let heading=type==='dish'?(data?.name?'Edit dish':'New dish'):type==='saved'?(data?.name?'Edit meal':'Build a meal'):type==='plan'?'Plan my week':type==='dailyAdmin'?'Daily list':type==='dailyEdit'?'Edit tasks and rewards':type==='template'?'Load a template':'Manage calendar';let save=type==='dish'?'saveDish()':type==='saved'?'saveSaved()':'close()';return `<div class="editor"><div class="editorhead"><button class="editor-link" style="color:var(--muted);font-size:25px" onclick="close()">×</button><span style="flex:1">${heading}</span>${type==='dish'||type==='saved'?btn('Save',save,'cta'):''}</div><div class="editorbody">${type==='dish'?dishEditor(data):type==='saved'?savedEditor(data):type==='plan'?planEditor():type==='dailyAdmin'?dailyAdmin():type==='dailyEdit'?dailyEdit():type==='template'?templateEditor():'<p class="muted">Manage a local sample calendar. Personal calendars are not connected.</p>'}</div></div>`}function dishEditor(data){let obj=s.dishes.find(x=>x.name===data?.name),k=obj?.kind||data?.kind||'Breakfast',p=obj?.prep||'Normal';return `<div class="editfield"><label class="upper">Name</label><input id="dishName" class="input" value="${esc(obj?.name||'')}" placeholder="Tacos"></div><div class="editfield"><label class="upper">Kind</label>${seg(['Breakfast','Main','Side'],k,"set('dishKind'")}</div><div class="editfield"><label class="upper">Prep time</label>${seg(['Quick','Normal','Slow'],p,"set('dishPrep'")}</div><div class="editfield"><label class="upper">Ingredients</label><textarea class="input" id="dishIngredients" rows="5" placeholder="milk - 1 gal">${esc(obj?.ingredients.join('\n')||'')}</textarea><p class="muted small">One per line, like milk - 1 gal. They go on the grocery list when this dish is planned.</p></div>`}function saveDish(){let n=$('dishName').value.trim();if(!n)return;let old=s.dishes.find(x=>x.name===s.editor.data?.name);let obj={name:n,kind:s.dishKind||old?.kind||s.editor.data?.kind||'Breakfast',prep:s.dishPrep||old?.prep||'Normal',ingredients:$('dishIngredients').value.split('\n').map(x=>x.trim()).filter(Boolean)};if(old)Object.assign(old,obj);else s.dishes.push(obj);s.dishKind=null;s.dishPrep=null;close()}function savedEditor(data){let old=s.saved.find(x=>x.name===data?.name);let selected=old?.dishes||[];return `<div class="editfield"><label class="upper">Name</label><input id="savedName" class="input" value="${esc(old?.name||'')}" placeholder="Taco night"></div>${seg(['Breakfast','Lunch or dinner'],old?.type||'Lunch or dinner',"set('savedKind'")}<div class="sectionname">INCLUDED ${selected.length}</div><div id="includedDishes">${selected.length?selected.map(n=>card(esc(n),'compact')).join(''):'<div class="empty">No dishes yet. Tap a dish below to add it.</div>'}</div><div class="row between"><div class="sectionname">AVAILABLE ${s.dishes.length}</div>${btn('+ New dish',"edit('dish',{kind:'Main'})")}</div><div class="stack" style="margin-top:10px">${s.dishes.map(d=>`<label class="row" style="padding:9px 0"><input type="checkbox" class="savedcheck" value="${esc(d.name)}" ${selected.includes(d.name)?'checked':''}><span>${esc(d.name)}</span><span class="muted small" style="margin-left:auto">${d.kind}</span></label>`).join('')}</div>`}function saveSaved(){let n=$('savedName').value.trim();if(!n)return;let chosen=[...document.querySelectorAll('.savedcheck:checked')].map(x=>x.value);if(!chosen.length){alert('Pick at least one dish.');return}let old=s.saved.find(x=>x.name===s.editor.data?.name),obj={name:n,type:s.savedKind||old?.type||'Lunch or dinner',dishes:chosen,prep:'Normal'};if(old)Object.assign(old,obj);else s.saved.push(obj);close()}function planEditor(){return `<p class="muted">Tap a day to choose from your saved meals.</p>${days.map((day,i)=>`<div class="card compact" style="margin-bottom:9px" onclick="s.editor=null;showModal('mealPick',${i})"><b>${day}</b> · ${esc(s.planned[i])}<span style="float:right;color:var(--accent)">Change ›</span></div>`).join('')}`}function dailyAdmin(){return `${subgroup('Who has a daily list')}${s.people.map(n=>card(`<div class="row"><div class="av">${avatar(n)}</div><div style="flex:1"><b>${esc(n)}</b><div class="muted small">${names.slice(0,2).includes(n)?'8 tasks, 18 points today':(s.profileTemplates?.[n]||'Not on the daily list')}</div></div><button class="pill" onclick="s.editPerson='${n}';edit('dailyEdit')">Edit ›</button></div>`,'compact')).join('<div style="height:10px"></div>')}`}function subgroup(t){return `<div class="green small" style="margin:10px 0 14px">${t}</div>`}function dailyEdit(){return `<div class="chips">${s.people.map(n=>btn(n,`s.editPerson='${n}';render()`,'pill '+(s.editPerson===n?'on':''))).join('')}</div><p class="muted small">Points per day: 18 · Mon Tue Wed Thu Fri Sat Sun</p>${['Morning','After school','Evening'].map(group=>`<h2 style="margin:25px 0 14px;font-weight:500">${group}</h2>${tasks.filter(x=>x[0]===group).map(([g,t,p])=>card(`<div class="row between"><div>${t}<div class="muted small">Every day</div></div><b>${p}</b></div>`,'compact')).join('<div style="height:6px"></div>')}${btn('Add task',"showModal('taskAdd',group)",'textbtn')}`).join('')}${btn('Load template',"edit('template')",'cta wide')}`}function templateEditor(){let variants=[['Young Child','about 4 to 7',41,9],['Pre-Teen','about 8 to 12',45,9],['Teenager','about 13 to 17',50,8],['Parent','adult',25,5]];return `<div class="green small" style="margin-bottom:15px">For ${s.editPerson}</div>${variants.map(([title,age,p,r])=>card(`<div class="row between"><b>${title}</b><span class="muted small">${age}</span></div><p class="muted small">Make bed, get ready, complete daily routines and more</p><div class="muted small">${p} points a day, ${r} rewards</div>${btn('Select template',`s.template='${title}';render()`,'textbtn')}`,'compact')).join('<div style="height:9px"></div>')}${btn('Load '+(s.template||'Parent')+' template',"loadTemplate()",'cta wide')}`}const initialTasks=structuredClone(tasks);function loadTemplate(){s.profileTemplates=s.profileTemplates||{};s.profileTemplates[s.editPerson]=s.template||'Parent';s.editor={type:'dailyEdit'};render()}function resetDemo(){s=structuredClone(baseline);tasks=structuredClone(initialTasks);render()}render();
</script></body></html>
