',to:'3:00 PM',title:'Birthday party',who:'Family',color:'#b49af1'},{day:25,when:'10:15 AM',to:'11:00 AM',title:'Haircut',who:'Parent A',color:'#d4a879'}]};let s=structuredClone(initial);const $=id=>document.getElementById(id);function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(text,action,style='outline'){return `<button class="${style}" onclick="${action.replaceAll('"','&quot;')}">${text}</button>`}function device(v){s.device=v;render();document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('selected',b.dataset.device===v))}function reset(){let d=s.device;s=structuredClone(initial);s.device=d;render()}function nav(t){s.tab=t;s.settings=false;s.query='';render();$('screen').scrollTop=0}function set(k,v){s[k]=v;render()}function modal(type,index=0){s.modal=type;s.selectedEvent=index;render()}function close(){s.modal=null;render()}function seg(items,chosen,key){return `<div class="seg">${items.map(x=>`<button class="${chosen===x?'on':''}" onclick="set('${key}','${x.replaceAll("'","\\'")}')">${esc(x)}</button>`).join('')}</div>`}function screenTitle(n){return `<h1 class="page-title">${n}</h1>`}function tabnav(isRail=false){return tabs.map(t=>`<button class="${s.tab===t?'on':''}" onclick="nav('${t}')"><span class="ico">${ico(t)}</span><span>${t}</span></button>`).join('')}function render(){const root=document.documentElement;let palette={Meadow:['#60d995','#204339'],Coral:['#ff8067','#49302d'],Ocean:['#48b7f1','#203e53'],Plum:['#ba90f4','#3b2d53']}[s.theme];root.style.setProperty('--accent',palette[0]);root.style.setProperty('--accentdim',palette[1]);let light=s.appearance==='Light';root.style.setProperty('--bg',light?'#f5f7fc':'#0d1321');root.style.setProperty('--panel',light?'#fff':'#192334');root.style.setProperty('--panel2',light?'#e7edf5':'#232f45');root.style.setProperty('--text',light?'#1c2940':'#f5eee8');root.style.setProperty('--muted',light?'#62718b':'#a7b1c3');root.style.setProperty('--stroke',light?'#d2dce9':'#32405c');$('device').className='device '+(s.device==='phone'?'':s.device);$('rail').innerHTML=tabnav(true);$('nav').innerHTML=tabnav();$('screen').innerHTML=s.settings?settings():({Home:home,Calendar:calendar,Meals:meals,Grocery:grocery,'Daily list':daily}[s.tab])();$('overlayhost').innerHTML=s.modal?overlay():''}function eventCard(e,i){return `<div class="card event" style="--ev:${e.color}" onclick="modal('event',${i})"><div class="row" style="align-items:start"><div class="when">${esc(e.when)}<div class="muted small" style="font-weight:400">${esc(e.to?('to '+e.to):'')}</div></div><div style="min-width:0"><div class="name">${esc(e.title)}</div><div class="by">● ${esc(e.who)}</div></div></div></div>`}function home(){let agendaRows=[

 for(let i=0;i<3;i++){
  let section=['Morning','After school','Evening'][i];
  out+='<div class="sectionbar"><b>'+section.toUpperCase()+'</b><span class="muted small">'+(i===1?'UP NOW':'Routine')+'</span></div>';
  for(const n of taskNames.slice(i===0?0:i===1?7:9,i===0?7:i===1?9:10)){
   let isDone=!!s.tasksDone[n];
   out+='<div class="listitem" onclick="toggleTask(\''+n+'\')"><button class="circle '+(isDone?'done':'')+'"></button><span style="flex:1" class="'+(isDone?'cross':'')+'">'+esc(n)+'</span><b style="color:var(--gold)">'+(isDone?'✓':'+5')+'</b></div>';
  }
 }
 return out;
}
function toggleTask(n){s.tasksDone[n]=!s.tasksDone[n];s.points[s.person]+=s.tasksDone[n]?5:-5;render()}function dailyRewards(){
 const items=[['Pick the music at dinner',15],['15 extra minutes of screen time',25],['Dessert or small treat',30],['Pick the movie for family movie night',100],['Ice cream outing',150],['Pick the weekend dinner',200],['Small toy or book',400]];
 let out='<div class="section">REWARDS '+s.points[s.person]+' pts to spend</div>';
 for(const item of items){
  const n=item[0],cost=item[1];
  const action=s.points[s.person]>=cost?button('Redeem','redeem('+cost+')','primary'):'<span class="muted small">'+(cost-s.points[s.person])+' to go</span>';
  out+='<div class="listitem reward"><div style="flex:1">'+esc(n)+'</div><span class="pts">'+cost+'</span>'+action+'<span style="color:var(--muted)">★</span></div>';
 }
 return out;
}
function redeem(c){s.points[s.person]-=c;modal('redeemed')}function settings(){
 const groups=[['Help and troubleshooting',[['Help and FAQ','Routines, answers, and the tour'],['Firestore reads','Demo only — no live Firestore reads']]],['Household, shared by every device',[['Sync across devices','Demo data only — not connected'],['People and photos','Mia, Leo, Parent A, Parent B'],['Daily list and rewards','Mia, Leo'],['Photo screensaver','Off'],['Manage devices','Demo mode']]],['This device only',[['Appearance and colors',s.appearance+' · '+s.theme],['Profile and tabs','Family, all tabs shown'],['Display and schedule','Night dimming is off'],['Daily list layout','Automatic'],['Keep buttons low','Automatic'],['Home layout','Phone'],['Home agenda','1 week'],['Calendar agenda','30 days'],['Software updates','Not available in web demo']]]];
 let out='<div class="row" style="margin-bottom:27px">'+button('←','s.settings=false;render()','pill')+'<h1 class="page-title" style="margin:0">Settings</h1></div>';
 for(const group of groups){out+='<div class="settings-label">'+esc(group[0])+'</div><div>';
 for(const row of group[1]){const title=row[0],detail=row[1];out+='<button class="setting" onclick="modal(\''+title+'\')"><span class="sq">◉</span><span class="detail">'+esc(title)+'<small>'+esc(detail)+'</small></span><span style="color:var(--muted)">❯</span></button>'}
 out+='</div>';
 }
 return out;
}
function overlay(){
 const type=s.modal, evt=s.events[s.selectedEvent]||s.events[0];
 let title=type,body='';
 if(type==='event'){
 title=evt.title;
 body='<p style="color:'+evt.color+'">● '+esc(evt.who)+'</p><p>October '+evt.day+', 2026</p><p>'+esc(evt.when)+' '+esc(evt.to)+'</p>'+button('Count down to this','modal("countdowns")','primary full')+'<p>'+button('Edit event','modal("addEvent")','outline full')+'</p>';
 }else if(type==='addEvent'){
 title='Add event';body='<div class="field"><label>TITLE</label><input id="eventTitle" class="input" placeholder="Cello lesson"></div><div class="field"><label>CALENDAR</label><select id="eventWho" class="input"><option>Family</option><option>Mia</option><option>Leo</option><option>Parent A</option></select></div><div class="field"><label>DAY IN OCTOBER</label><input id="eventDay" type="number" min="1" max="31" value="26" class="input"></div><div class="field"><label>STARTS</label><input id="eventTime" value="5:00 PM" class="input"></div>';
 }else if(type==='dish'||type==='meal'){
 title=type==='dish'?'New dish':'Build a meal';body='<div class="field"><label>NAME</label><input class="input" id="'+(type==='dish'?'newDish':'newMeal')+'" placeholder="Name"></div><div class="field"><label>TYPE</label><select class="input"><option>Main</option><option>Breakfast</option><option>Side</option></select></div>';
 }else if(type==='Appearance and colors'){
 body='<div class="section">APPEARANCE</div>';
 for(const x of ['Dark','Light'])body+=button(x,'s.appearance="'+x+'";render()','pill '+(x===s.appearance?'on':''));
 body+='<div class="section">ACCENT COLOR</div>';
 for(const x of ['Coral','Ocean','Meadow','Plum'])body+=button(x,'s.theme="'+x+'";render()','pill '+(x===s.theme?'on':''));
 }else if(type==='People and photos'){
 body='<p class="muted">Fictional household members. No photos are uploaded.</p>';
 for(const n of ['Mia','Leo','Parent A','Parent B'])body+='<div class="listitem">● '+n+'</div>';
 }else if(type==='day'){
 title='Day '+s.selectedEvent;
 body=s.events.filter(x=>x.day===s.selectedEvent).map(x=>'<p>'+esc(x.when)+' · '+esc(x.title)+'</p>').join('')||'<p>No sample events on this day.</p>';
 }else{
 body='<p class="muted">This is a local-only demonstration. No real account, calendar, album, or device is accessed.</p>';
 }
 const canSave=['addEvent','dish','meal'].includes(type);
 return '<div class="overlay" onclick="if(event.target===this)close()"><div class="dialog" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2>'+body+'<footer>'+button('Close','close()','outline')+(canSave?button('Save','saveModal("'+type+'")','primary'):'')+'</footer></div></div>';
}
function saveModal(type){if(type==='addEvent'){let title=$('eventTitle').value.trim();if(title){s.events.push({day:Math.max(1,Math.min(31,Number($('eventDay').value)||26)),when:$('eventTime').value||'5:00 PM',to:'6:00 PM',title,who:$('eventWho').value,color:'#b49af1'})}}if(type==='dish'){let v=$('newDish').value.trim();if(v)s.dishes.push(v)}if(type==='meal'){let v=$('newMeal').value.trim();if(v)s.saved.push(v)}close()}render();
</script></body></html>
