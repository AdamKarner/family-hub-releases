name: Demo retirement checks

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'preview/**'
      - 'tests/demo-*.spec.js'
      - 'docs/DEMO_SPEC.md'
      - '.github/workflows/demo-checks.yml'
      - 'playwright.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm retired pages are safe and direct to real app
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          for (const file of ['demo/index.html', 'preview/index.html']) {
            const html = fs.readFileSync(file, 'utf8');
            assert.match(html, /<meta name="robots" content="noindex, nofollow">/);
            assert.match(html, /Interactive demo retired/);
            assert.match(html, /https:\/\/app\.kindlane\.app\//);
            assert.match(html, /\.\.\/get-started\.html/);
            assert.match(html, /\.\.\/web\.html/);
            for (const unsafe of [/<script/i, /firebaseConfig/i, /AIza[0-9A-Za-z_-]{35}/, /<form/i, /id="screen"/, /id="nav"/]) {
              assert(!unsafe.test(html), 'Unexpected executable or old demo content in ' + file);
            }
          }
          console.log('Retirement pages: safe, static, real-app routes present');
          JS
      - name: Ensure approved website not changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(index.html|setup.html|setup/|\.github/workflows/release.yml)$'; then
            echo '::error::Demo retirement PR must not change approved landing page, setup or APK release automation'
            exit 1
          fi

  browser:
    # Playwright 1.56.1 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Check retired pages and capture responsive evidence
        run: npx playwright test tests/demo-smoke.spec.js tests/demo-visual.spec.js --reporter=line
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-retirement-browser-evidence
          path: |
            test-results/retired-demo-review/
            test-results/**/*.png
            playwright-report/
          if-no-files-found: ignore
