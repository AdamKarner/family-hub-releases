name: Demo checks

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/demo-checks.yml'
      - 'playwright.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original demo asset hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from importlib.machinery import SourceFileLoader
          import sys
          sys.path.insert(0,'scripts')
          from import_phone_demo import EXPECTED, ROOT
          for name in ('mia.webp','leo.webp'):
              digest,size=EXPECTED[name]
              data=(ROOT/'demo'/name).read_bytes()
              assert len(data)==size and sha256(data).hexdigest()==digest, name
          html=(ROOT/'demo/index.html').read_text()
          assert 'Phone fidelity demo v1.2' in html
          assert 'v12-android-native-tokens' in html
          print('v1.2 source and unchanged portrait assets verified')
          PY
      - name: Check HTML script syntax and demo isolation
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('demo/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          assert(scripts.length, 'No inline scripts found');
          scripts.forEach((match, i) => new vm.Script(match[1], { filename: 'demo-script-' + i }));
          for (const match of [/AIza[0-9A-Za-z_-]{35}/, /private_key/, /firebaseConfig\s*=/i, /fetch\s*\(/]) {
            assert(!match.test(html), 'Review blocked for suspicious secret or external call: ' + match);
          }
          for (const item of ['id="screen"', 'id="nav"', 'resetDemo']) {
            assert(html.includes(item), 'Missing expected demo component: ' + item);
          }
          console.log('Demo JavaScript syntax and preliminary isolation checks passed');
          JS
      - name: Ensure approved website not changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(index.html|setup.html|setup/|\.github/workflows/release.yml)$'; then
            echo '::error::Demo PR must not change approved landing page, setup or APK release automation'
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Chromium smoke test
        run: npx playwright test tests/demo-smoke.spec.js --reporter=line
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
