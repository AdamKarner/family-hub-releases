name: Public website checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'download.html'
      - 'releases.html'
      - 'install.html'
      - 'hearth.html'
      - 'skylight.html'
      - 'help.html'
      - 'feedback.html'
      - 'privacy.html'
      - 'tests/website-smoke.spec.js'
      - 'tests/website-review-screenshots.spec.js'
      - 'tests/website-a11y.spec.js'
      - 'web.html'
      - 'get-started.html'
      - 'start.html'
      - 'setup.html'
      - 'setup/index.html'
      - 'setup-demo.html'
      - 'household-setup-concept.html'
      - 'access.html'
      - '.github/workflows/website-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'download.html'
      - 'releases.html'
      - 'install.html'
      - 'hearth.html'
      - 'skylight.html'
      - 'help.html'
      - 'feedback.html'
      - 'privacy.html'
      - 'get-started.html'
      - 'start.html'
      - 'setup.html'
      - 'setup/index.html'
      - 'setup-demo.html'
      - 'household-setup-concept.html'
      - 'access.html'
      - 'web.html'
      - 'tests/website-smoke.spec.js'
      - 'tests/website-review-screenshots.spec.js'
      - 'tests/website-a11y.spec.js'
      - '.github/workflows/website-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --no-save @playwright/test@1.56.1 axe-core@4.14.0
          # Avoid the Azure Ubuntu mirror that stalled browser font downloads.
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if test -f "$sources"; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
          npx playwright install --with-deps chromium
      - run: npx playwright test tests/website-smoke.spec.js tests/website-review-screenshots.spec.js tests/website-a11y.spec.js --reporter=line
      - name: Upload browser QA screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-qa-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
