<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Hub · App Check Diagnostic</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#0b1425;color:#f8f7f5;padding:24px}main{max-width:620px;margin:7vh auto;background:#152139;border:1px solid #3a4760;border-radius:20px;padding:30px}h1{margin-top:0}p{line-height:1.6;color:#c0c8d9}button{background:#ff8067;border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer}#result{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#ffab96}</style></head><body><main><a href="./">← Family Hub</a><h1>App Check diagnostic</h1><p>Safe test only. Requests a Firebase App Check token for the downloads web app. No personal information, database reads, or database writes are performed. This page does not enable enforcement.</p><button id="test">Test App Check</button><p id="result" role="status">Ready to test.</p></main><script src="./distribution-config.js"></script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{initializeAppCheck,ReCaptchaEnterpriseProvider,getToken}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check.js";const SITE_KEY="6LcrmPotAAAAAAIKmxxgqWEerMbyOJuyfX0A8qfI";const b=document.getElementById("test"),out=document.getElementById("result"),cfg=window.FAMILY_HUB_DISTRIBUTION_CONFIG;b.onclick=async()=>{b.disabled=true;out.textContent="Requesting App Check token…";try{if(!cfg?.appId)throw Error("Firebase config is missing.");const app=initializeApp(cfg,"diagnostic"),check=initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(SITE_KEY),isTokenAutoRefreshEnabled:false});const response=await getToken(check,true);if(!response?.token)throw Error("No token returned.");out.textContent="SUCCESS — App Check returned a token. Token contents are not displayed or stored. Firestore enforcement remains unchanged.";}catch(e){out.textContent="FAILED — "+String(e?.code||e?.message||e)+"\nNo Firebase settings were changed.";}finally{b.disabled=false;}};</script></body></html>
